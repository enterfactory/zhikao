# Compatibility profile; all application profiles now use the same real ECS services.
spring:
  config:
    import: optional:file:.env.ecs.local[.properties],optional:file:../.env.ecs.local[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${ZHIKAO_DB_SCHEMA:zhikao}&connectTimeout=5&socketTimeout=30
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    default-schema: ${ZHIKAO_DB_SCHEMA:zhikao}
    schemas: ${ZHIKAO_DB_SCHEMA:zhikao}
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${ZHIKAO_REDIS_CONNECT_TIMEOUT:5s}
      timeout: ${ZHIKAO_REDIS_TIMEOUT:10s}
sa-token:
  timeout: 43200
  is-share: false
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
zhikao:
  db-type: postgresql
  demo-data:
    enabled: false
  security:
    default-password: ''
  cors:
    allowed-origin-patterns: ${ZHIKAO_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  redis:
    enabled: true
    required: true
    namespace: ${ZHIKAO_REDIS_NAMESPACE:zhikao:ecs:}
  ai:
    enabled: true
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL}
    model: openai:${LLM_MODEL}
  vector:
    enabled: true
    base-url: http://${QDRANT_HOST}:${QDRANT_PORT:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${ZHIKAO_VECTOR_COLLECTION:zhikao_knowledge_v1}
    embedding-base-url: ${EMBEDDING_BASE_URL}
    embedding-api-key: ${EMBEDDING_API_KEY}
    embedding-model: ${EMBEDDING_MODEL}
    dimensions: ${EMBEDDING_DIM:1024}
